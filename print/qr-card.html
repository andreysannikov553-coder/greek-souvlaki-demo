<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>QR menu card · Greek Souvlaki Nha Trang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Manrope:wght@500;600;700&family=Unbounded:wght@700;800&display=swap">
<style>
/* A6 table card, 105 × 148 mm. Print at 100 %, no margins. */
@page{size:105mm 148mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#0d1730}
body{display:flex;flex-direction:column;align-items:center;gap:10mm;padding:10mm 0}
@media print{body{padding:0;gap:0;background:none}}
.card{width:105mm;height:148mm;position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(120% 70% at 85% 0%,#1350B5 0%,#0B3D91 38%,#071A3A 78%);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;page-break-after:always;
  display:flex;flex-direction:column;align-items:center;padding:9mm 8mm 7mm;font-family:'Manrope',sans-serif}
.frame{position:absolute;inset:4mm;border:.35mm solid rgba(255,255,255,.28);border-radius:3mm;pointer-events:none}
.meander{width:100%;height:3mm;color:rgba(255,255,255,.35)}
.brand{margin-top:4mm;text-align:center}
.brand b{display:block;font:800 13pt/1 'Unbounded',sans-serif;letter-spacing:.04em}
.brand span{display:block;margin-top:1.6mm;font:700 6.5pt/1 'Manrope';letter-spacing:.42em;color:rgba(255,255,255,.75)}
h1{margin:5mm 0 0;text-align:center;font:italic 600 22pt/1 'Cormorant Garamond',serif;color:#9CC3FF}
.langs{margin:1.6mm 0 0;font:700 6.4pt/1 'Manrope';letter-spacing:.3em;text-transform:uppercase;color:#E8B04A}
.qr{margin-top:5mm;width:58mm;height:58mm;padding:2.5mm;background:#fff;border-radius:4mm;box-shadow:0 2mm 6mm rgba(0,0,0,.35)}
.qr img{width:100%;height:100%;display:block}
.scan{margin-top:4.5mm;text-align:center;font:600 7.6pt/1.45 'Manrope'}
.scan span{display:block}
.scan .vi{font-weight:700;font-size:8.4pt}
.scan .mute{color:rgba(255,255,255,.7)}
.foot{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:3mm;font:600 6.2pt/1.45 'Manrope';color:rgba(255,255,255,.8)}
.foot b{color:#fff}
.pill{padding:1.2mm 2.4mm;border-radius:99mm;border:.3mm solid rgba(255,255,255,.3);white-space:nowrap}
</style>
</head>
<body>
<div class="card">
  <div class="frame"></div>
  <svg class="meander" viewBox="0 0 280 10" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="m" width="28" height="10" patternUnits="userSpaceOnUse"><path d="M0 9h4V1h8v6H8V4M14 9h4V1h8v6h-4V4" fill="none" stroke="currentColor" stroke-width="1.4"/></pattern></defs><rect width="280" height="10" fill="url(#m)"/></svg>
  <div class="brand" lang="en"><b>GREEK SOUVLAKI</b><span>NHA TRANG</span></div>
  <h1>Thực đơn · Menu</h1>
  <p class="langs">Tiếng Việt · English · Русский</p>
  <div class="qr"><img src="qr-menu.svg" alt="QR: greeksouvlaki.store/menu.html"></div>
  <p class="scan">
    <span class="vi" lang="vi">Quét mã bằng camera để xem thực đơn</span>
    <span lang="en">Scan with your camera to see the menu</span>
    <span class="mute" lang="ru">Наведите камеру — откроется меню</span>
  </p>
  <div class="foot">
    <span><b>115 Nguyễn Thiện Thuật</b><br>09:30–23:00 · +84 78 450 8999</span>
    <span class="pill" lang="vi">Chỉ tiền mặt · Cash only</span>
  </div>
</div>
</body>
</html>
